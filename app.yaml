kind: wasmer.io/App.v0
name: agnes
owner: '1198079622'
package: .
annotations:
  anybuild.run/config:
    commands:
      build: npm run build
      install: npm install
      start: node dist/index.js
    edgejs_enable: true
    edgejs_precompile: true
    name: out
    node_build_command: npm run build
    node_install_inputs:
    - package.json
    node_package_manager: npm
    node_package_name: agnes-compatible-gateway
    node_remove_native_binaries: true
    node_server: hono
    npm_version: '11'
  anybuild.run/provider: node
  anybuild.run/version: 0.29.0
  wasmer.io/version: 7.4.2
